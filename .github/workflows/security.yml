name: DevSecOps Security Audit

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  security-audit:
    name: Dependency Vulnerability & Maintenance Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run NPM Audit & Maintenance Checks
        run: node scripts/security-audit.cjs

      - name: Run Snyk Security Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=critical --fail-on=all --app-vulns
